name: Replay

on: [push, pull_request]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python replay.py --prepare-only
      - run: python replay.py --offline --session .runs/ci --routes continue restart rollback rollback-full
      - run: python replay.py --offline --session .runs/ci --routes continue restart rollback rollback-full
      - run: docker pull python:3.12-slim
      - run: python replay.py --offline --docker-image python:3.12-slim --timeout 30
